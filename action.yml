name: awesome-alternatives refresh
description: Refresh this repository's awesome-alternatives listing now instead of at the next nightly run
author: awesome-alternatives
branding:
  icon: refresh-cw
  color: gray-dark

inputs:
  api-url:
    description: Base URL of the awesome-alternatives API
    default: https://awesome-alternatives.com/api
  audience:
    description: Audience of the OIDC token the API accepts
    default: awesome-alternatives

runs:
  using: composite
  steps:
    - shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::warning::No OIDC token available. Give the job 'permissions: id-token: write'."
          exit 0
        fi
        token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value) || token=
        if [ -z "$token" ] || [ "$token" = null ]; then
          echo "::warning::GitHub did not hand out an OIDC token, the listing updates at the next nightly refresh."
          exit 0
        fi
        echo "::add-mask::$token"
        response="$RUNNER_TEMP/awesome-alternatives-refresh.json"
        status=$(curl -sS -o "$response" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $token" "$API_URL/v1/refresh") || true
        case "$status" in
          202)
            slugs=$(jq -r '.slugs | join(", ")' "$response")
            if [ "$(jq -r .dispatched "$response")" = true ]; then
              echo "::notice::Refreshing $slugs on awesome-alternatives."
            else
              echo "::notice::$slugs was refreshed a few minutes ago, this release is picked up by that run or the next nightly one."
            fi
            ;;
          404)
            echo "::warning::$GITHUB_REPOSITORY is not listed on awesome-alternatives."
            ;;
          *)
            echo "::warning::awesome-alternatives answered $status, the listing updates at the next nightly refresh."
            cat "$response" 2>/dev/null || true
            ;;
        esac
